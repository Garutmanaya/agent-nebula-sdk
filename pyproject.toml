[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-nebula-sdk"
version = "1.2.1"
description = "Standards-oriented security SDK for Agent Nebula and Agent Genesis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Agent Nebula Project" }]
dependencies = [
  "cryptography>=45.0.0,<47",
  "httpx>=0.28.1,<1",
  "PyJWT[crypto]>=2.10.1,<3",
  "pydantic>=2.11.0,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.15.0,<2",
  "pytest>=8.3.0,<9",
  "pytest-cov>=6.0.0,<7",
  "ruff>=0.11.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_nebula_sdk"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["agent_nebula_sdk"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["agent_nebula_sdk"]
