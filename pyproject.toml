[build-system]
requires = ["hatchling>=1.27", "agent-nebula-dependencies>=1.1.6,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-nebula-sdk"
version = "1.1.1"
description = "Standards-oriented security SDK for Agent Nebula and Agent Genesis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Agent Nebula Project" }]
dynamic = ["dependencies"]

[dependency-groups]
dev = ["agent-nebula-dependencies[dev]>=1.1.6,<2"]

[tool.hatch.metadata.hooks.agent-nebula]
packages = ["cryptography", "httpx", "pyjwt-crypto", "pydantic"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_nebula_sdk"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["agent_nebula_sdk"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["agent_nebula_sdk"]
